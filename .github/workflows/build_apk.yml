name: Build POS & SaaS APKs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto Unzip Project
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Unzipping $ZIP_FILE..."
            unzip -o "$ZIP_FILE"
          fi

      - name: Set up Java / JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Restaurant POS APK
        run: |
          POS_DIR=$(find . -type d -name "restaurant_pos" | head -n 1)
          echo "Found POS DIR: $POS_DIR"
          cd "$POS_DIR"
          flutter create . --platforms=android --org=com.restaurant.pos
          # Fix multicast_dns version mismatch
          sed -i 's/multicast_dns:.*/multicast_dns: ^0.3.3+1/g' pubspec.yaml
          flutter pub get
          flutter build apk --debug --no-tree-shake-icons
          mkdir -p $GITHUB_WORKSPACE/output_pos
          cp build/app/outputs/flutter-apk/app-debug.apk $GITHUB_WORKSPACE/output_pos/Restaurant-POS.apk

      - name: Upload Restaurant POS APK
        uses: actions/upload-artifact@v4
        with:
          name: Restaurant-POS-App
          path: output_pos/Restaurant-POS.apk
          
