name: Build POS & SaaS APKs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto Unzip Project
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Unzipping $ZIP_FILE..."
            unzip -o "$ZIP_FILE"
          fi

      - name: Set up Java / JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Restaurant POS APK (Outlet App)
        run: |
          POS_DIR=$(find . -maxdepth 4 -type f -name "pubspec.yaml" | grep "restaurant_pos" | head -n 1 | xargs dirname)
          echo "Building POS in: $POS_DIR"
          cd "$POS_DIR"
          # Fix wrong multicast_dns version constraint directly
          python3 -c "
          with open('pubspec.yaml', 'r') as f:
              c = f.read()
          c = c.replace('^0.3.3+2', '^0.3.3+1')
          with open('pubspec.yaml', 'w') as f:
              f.write(c)
          "
          flutter create . --platforms=android --org=com.restaurant.pos
          flutter pub get
          flutter build apk --debug --no-tree-shake-icons
          mkdir -p $GITHUB_WORKSPACE/output_pos
          cp build/app/outputs/flutter-apk/app-debug.apk $GITHUB_WORKSPACE/output_pos/Restaurant-POS-Outlet.apk

      - name: Build SaaS Portal APK (Admin App)
        run: |
          PORTAL_DIR=$(find . -maxdepth 4 -type f -name "pubspec.yaml" | grep "saas_portal" | head -n 1 | xargs dirname)
          echo "Building SaaS Portal in: $PORTAL_DIR"
          cd "$PORTAL_DIR"
          flutter create . --platforms=android --org=com.saas.portal
          flutter pub get
          flutter build apk --debug --no-tree-shake-icons
          mkdir -p $GITHUB_WORKSPACE/output_portal
          cp build/app/outputs/flutter-apk/app-debug.apk $GITHUB_WORKSPACE/output_portal/SaaS-Admin-Portal.apk

      - name: Upload Restaurant POS APK (Outlet)
        uses: actions/upload-artifact@v4
        with:
          name: 1-Restaurant-POS-Outlet-APK
          path: output_pos/Restaurant-POS-Outlet.apk

      - name: Upload SaaS Portal APK (Admin)
        uses: actions/upload-artifact@v4
        with:
          name: 2-SaaS-Admin-Portal-APK
          path: output_portal/SaaS-Admin-Portal.apk
