name: Build POS & SaaS APKs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto Unzip Project
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Unzipping $ZIP_FILE..."
            unzip -o "$ZIP_FILE"
          fi

      - name: Set up Java / JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Restaurant POS APK
        run: |
          POS_DIR=$(find . -type f -name "pubspec.yaml" | grep "restaurant_pos" | head -n 1 | xargs dirname)
          if [ -z "$POS_DIR" ]; then POS_DIR="."; fi
          echo "Building Restaurant POS in: $POS_DIR"
          cd "$POS_DIR"
          flutter pub get
          flutter build apk --debug --no-tree-shake-icons

      - name: Build SaaS Portal APK
        run: |
          PORTAL_DIR=$(find . -type f -name "pubspec.yaml" | grep "saas_portal" | head -n 1 | xargs dirname)
          if [ -n "$PORTAL_DIR" ]; then
            echo "Building SaaS Portal in: $PORTAL_DIR"
            cd "$PORTAL_DIR"
            flutter create . --platforms=android --org=com.saas.portal || true
            flutter pub get
            flutter build apk --debug --no-tree-shake-icons
          fi

      - name: Upload Restaurant POS APK
        uses: actions/upload-artifact@v4
        with:
          name: Restaurant-POS-App
          path: "**/restaurant_pos/**/build/app/outputs/flutter-apk/app-debug.apk"

      - name: Upload SaaS Portal APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SaaS-Partner-Portal-App
          path: "**/saas_portal/**/build/app/outputs/flutter-apk/app-debug.apk"
