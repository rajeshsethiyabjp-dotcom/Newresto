name: Build POS & SaaS APKs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto Unzip Project
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Unzipping $ZIP_FILE..."
            unzip -o "$ZIP_FILE"
          fi

      - name: Inject Full Modern UI into Apps
        run: |
          # 1. Update Restaurant POS UI
          POS_MAIN=$(find . -path "*/restaurant_pos/lib/main.dart" | head -n 1)
          cat << 'EOF' > "$POS_MAIN"
          import 'package:flutter/material.dart';

          void main() => runApp(const RestaurantPosApp());

          class RestaurantPosApp extends StatelessWidget {
            const RestaurantPosApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Restaurant POS & BOH',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(colorScheme: ColorScheme.fromSeed(seedColor: Colors.deepOrange), useMaterial3: true),
                home: const MainPosScreen(),
              );
            }
          }

          class MainPosScreen extends StatefulWidget {
            const MainPosScreen({super.key});
            @override
            State<MainPosScreen> createState() => _MainPosScreenState();
          }

          class _MainPosScreenState extends State<MainPosScreen> {
            int _currentIndex = 0;
            final List<Widget> _screens = const [BillingScreen(), TableFloorScreen(), KdsScreen(), InventoryIndentScreen()];

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: _screens[_currentIndex],
                bottomNavigationBar: NavigationBar(
                  selectedIndex: _currentIndex,
                  onDestinationSelected: (idx) => setState(() => _currentIndex = idx),
                  destinations: const [
                    NavigationDestination(icon: Icon(Icons.point_of_sale), label: 'Billing'),
                    NavigationDestination(icon: Icon(Icons.table_restaurant), label: 'Tables'),
                    NavigationDestination(icon: Icon(Icons.kitchen), label: 'Kitchen (KDS)'),
                    NavigationDestination(icon: Icon(Icons.inventory_2), label: 'Store & Indent'),
                  ],
                ),
              );
            }
          }

          class BillingScreen extends StatelessWidget {
            const BillingScreen({super.key});
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Counter POS Billing'), actions: [IconButton(icon: const Icon(Icons.print), onPressed: () {})]),
                body: Row(
                  children: [
                    Expanded(
                      flex: 6,
                      child: GridView.count(
                        crossAxisCount: 2,
                        padding: const EdgeInsets.all(8),
                        childAspectRatio: 1.2,
                        children: [
                          _card('Paneer Tikka', '₹220', Colors.orange.shade50),
                          _card('Dal Makhani', '₹180', Colors.amber.shade50),
                          _card('Butter Roti', '₹25', Colors.blue.shade50),
                          _card('Veg Biryani', '₹240', Colors.green.shade50),
                        ],
                      ),
                    ),
                    Container(
                      width: 150,
                      color: Colors.grey.shade100,
                      padding: const EdgeInsets.all(8),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          const Text('Active Bill', style: TextStyle(fontWeight: FontWeight.bold)),
                          const Divider(),
                          const Text('Paneer Tikka x1'),
                          const Text('Butter Roti x4'),
                          const Spacer(),
                          const Text('Total: ₹320', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: Colors.deepOrange)),
                          const SizedBox(height: 8),
                          ElevatedButton(
                            onPressed: () {},
                            style: ElevatedButton.styleFrom(backgroundColor: Colors.deepOrange, foregroundColor: Colors.white),
                            child: const Text('Pay UPI'),
                          )
                        ],
                      ),
                    )
                  ],
                ),
              );
            }
            Widget _card(String t, String p, Color c) => Card(color: c, child: Center(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [Text(t, style: const TextStyle(fontWeight: FontWeight.bold)), Text(p)])));
          }

          class TableFloorScreen extends StatelessWidget {
            const TableFloorScreen({super.key});
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Table & Floor Plan')),
                body: GridView.count(
                  crossAxisCount: 3,
                  padding: const EdgeInsets.all(12),
                  children: [
                    _tBox('T-1', 'Occupied', Colors.red.shade100, Colors.red),
                    _tBox('T-2', 'Vacant', Colors.green.shade100, Colors.green),
                    _tBox('T-3', 'Billed', Colors.orange.shade100, Colors.orange),
                    _tBox('T-4', 'Vacant', Colors.green.shade100, Colors.green),
                  ],
                ),
              );
            }
            Widget _tBox(String n, String s, Color b, Color tc) => Card(color: b, child: Center(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [Text(n, style: const TextStyle(fontSize: 20, fontWeight: FontWeight.bold)), Text(s, style: TextStyle(color: tc, fontWeight: FontWeight.bold))])));
          }

          class KdsScreen extends StatelessWidget {
            const KdsScreen({super.key});
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Live Kitchen Display (KDS)')),
                body: ListView(
                  padding: const EdgeInsets.all(12),
                  children: [
                    Card(
                      color: Colors.amber.shade50,
                      child: ListTile(
                        title: const Text('Order #104 - Table 1 (8m ago)'),
                        subtitle: const Text('2x Paneer Tikka\n1x Jeera Rice'),
                        trailing: ElevatedButton(onPressed: () {}, child: const Text('Food Ready')),
                      ),
                    )
                  ],
                ),
              );
            }
          }

          class InventoryIndentScreen extends StatelessWidget {
            const InventoryIndentScreen({super.key});
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Store & Kitchen Indent')),
                body: ListView(
                  padding: const EdgeInsets.all(12),
                  children: [
                    const ListTile(leading: Icon(Icons.warning, color: Colors.red), title: Text('Low Stock Alert: Paneer'), subtitle: Text('Current: 1.2 kg | Par Level: 5.0 kg')),
                    const Divider(),
                    ElevatedButton.icon(onPressed: () {}, icon: const Icon(Icons.add_shopping_cart), label: const Text('Chef Demand / Kitchen Indent')),
                    const SizedBox(height: 8),
                    OutlinedButton.icon(onPressed: () {}, icon: const Icon(Icons.receipt_long), label: const Text('Generate PO / Vendor Order')),
                  ],
                ),
              );
            }
          }
          EOF

          # 2. Update SaaS Portal UI
          PORTAL_MAIN=$(find . -path "*/saas_portal/lib/main.dart" | head -n 1)
          cat << 'EOF' > "$PORTAL_MAIN"
          import 'package:flutter/material.dart';

          void main() => runApp(const SaasPortalApp());

          class SaasPortalApp extends StatelessWidget {
            const SaasPortalApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Partner SaaS Portal',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(colorScheme: ColorScheme.fromSeed(seedColor: Colors.indigo), useMaterial3: true),
                home: const SaasDashboard(),
              );
            }
          }

          class SaasDashboard extends StatelessWidget {
            const SaasDashboard({super.key});
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('SaaS Control & Partner Admin')),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    Row(
                      children: [
                        _box('Active Outlets', '24', Colors.blue.shade50),
                        const SizedBox(width: 8),
                        _box('Live Terminals', '68', Colors.green.shade50),
                      ],
                    ),
                    const SizedBox(height: 16),
                    Card(child: ListTile(leading: const Icon(Icons.key, color: Colors.indigo), title: const Text('Generate License Key'), subtitle: const Text('Hardware-Locked POS Licenses'), trailing: const Icon(Icons.arrow_forward_ios, size: 16))),
                    Card(child: ListTile(leading: const Icon(Icons.people, color: Colors.teal), title: const Text('Sales & Field Agents'), subtitle: const Text('Onboarding pipeline & targets'), trailing: const Icon(Icons.arrow_forward_ios, size: 16))),
                    Card(child: ListTile(leading: const Icon(Icons.support_agent, color: Colors.red), title: const Text('Client Support Tickets'), subtitle: const Text('0 Pending issues'), trailing: const Icon(Icons.arrow_forward_ios, size: 16))),
                  ],
                ),
              );
            }
            Widget _box(String l, String v, Color c) => Expanded(child: Container(padding: const EdgeInsets.all(16), decoration: BoxDecoration(color: c, borderRadius: BorderRadius.circular(12)), child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [Text(l, style: const TextStyle(fontSize: 12, color: Colors.black54)), const SizedBox(height: 4), Text(v, style: const TextStyle(fontSize: 24, fontWeight: FontWeight.bold))])));
          }
          EOF

      - name: Set up Java / JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Restaurant POS APK (Outlet App)
        run: |
          POS_DIR=$(find . -maxdepth 4 -type f -name "pubspec.yaml" | grep "restaurant_pos" | head -n 1 | xargs dirname)
          cd "$POS_DIR"
          python3 -c "
          with open('pubspec.yaml', 'r') as f:
              c = f.read()
          c = c.replace('^0.3.3+2', '^0.3.3+1')
          with open('pubspec.yaml', 'w') as f:
              f.write(c)
          "
          flutter create . --platforms=android --org=com.restaurant.pos
          flutter pub get
          flutter build apk --debug --no-tree-shake-icons
          mkdir -p $GITHUB_WORKSPACE/output_pos
          cp build/app/outputs/flutter-apk/app-debug.apk $GITHUB_WORKSPACE/output_pos/Restaurant-POS-Outlet.apk

      - name: Build SaaS Portal APK (Admin App)
        run: |
          PORTAL_DIR=$(find . -maxdepth 4 -type f -name "pubspec.yaml" | grep "saas_portal" | head -n 1 | xargs dirname)
          cd "$PORTAL_DIR"
          flutter create . --platforms=android --org=com.saas.portal
          flutter pub get
          flutter build apk --debug --no-tree-shake-icons
          mkdir -p $GITHUB_WORKSPACE/output_portal
          cp build/app/outputs/flutter-apk/app-debug.apk $GITHUB_WORKSPACE/output_portal/SaaS-Admin-Portal.apk

      - name: Upload Restaurant POS APK (Outlet)
        uses: actions/upload-artifact@v4
        with:
          name: 1-Restaurant-POS-Outlet-APK
          path: output_pos/Restaurant-POS-Outlet.apk

      - name: Upload SaaS Portal APK (Admin)
        uses: actions/upload-artifact@v4
        with:
          name: 2-SaaS-Admin-Portal-APK
          path: output_portal/SaaS-Admin-Portal.apk
